name: devsync-dev

x-development: &development
  build:
    context: .
    dockerfile: Dockerfile.dev
  image: devsync-development:local
  init: true
  entrypoint: ["sh", "/app/scripts/docker-dev-entrypoint.sh"]
  volumes:
    - .:/app
    - server-dependencies:/app/node_modules
    - web-dependencies:/app/web/node_modules
    - npm-cache:/root/.npm

services:
  server:
    <<: *development
    working_dir: /app
    command: ["npm", "run", "dev:server"]
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "4000"
      AUTH_MODE: ${AUTH_MODE:-none}
      AUTH_COOKIE_SECURE: "false"
      DEVSYNC_DATA_ROOT: /data
      DEVSYNC_DATA_DIR: ""
      DEVSYNC_VAULT_NAME: ${DEVSYNC_DEV_VAULT_NAME:-devsync-dev-vault}
      DEVSYNC_VAULT_REPO_URL: ""
      DEVSYNC_WEB_DIST: /app/web/dist
      DEVSYNC_PUBLIC_URL: http://127.0.0.1:${DEVSYNC_DEV_WEB_PORT:-5173}
    ports:
      - "127.0.0.1:${DEVSYNC_DEV_API_PORT:-4000}:4000"
    volumes:
      - .:/app
      - server-dependencies:/app/node_modules
      - web-dependencies:/app/web/node_modules
      - npm-cache:/root/.npm
      - "${DEVSYNC_DEV_DATA_DIR:-./data}:/data"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 30

  web:
    <<: *development
    working_dir: /app/web
    command: ["node", "node_modules/vite/bin/vite.js", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    environment:
      NODE_ENV: development
      DEVSYNC_API_PROXY_TARGET: http://server:4000
      DEVSYNC_WEB_POLLING: ${DEVSYNC_WEB_POLLING:-true}
    ports:
      - "127.0.0.1:${DEVSYNC_DEV_WEB_PORT:-5173}:5173"
    depends_on:
      server:
        condition: service_healthy

volumes:
  server-dependencies:
  web-dependencies:
  npm-cache:
