services:
  devsync:
    build: .
    ports:
      - "4000:4000"
    environment:
      HOST: 0.0.0.0
      AUTH_MODE: ${AUTH_MODE:-password}
      AUTH_USERS: ${AUTH_USERS:-}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      DEVSYNC_API_TOKEN: ${DEVSYNC_API_TOKEN:-}
      DEVSYNC_DATA_ROOT: /data
      DEVSYNC_VAULT_NAME: ${DEVSYNC_VAULT_NAME:-devsync-vault}
      DEVSYNC_VAULT_REPO_URL: ${DEVSYNC_VAULT_REPO_URL:-}
      DEVSYNC_GIT_USERNAME: ${DEVSYNC_GIT_USERNAME:-oauth2}
      DEVSYNC_GIT_TOKEN: ${DEVSYNC_GIT_TOKEN:-}
      DEVSYNC_GIT_COMMIT_NAME: ${DEVSYNC_GIT_COMMIT_NAME:-Devsync}
      DEVSYNC_GIT_COMMIT_EMAIL: ${DEVSYNC_GIT_COMMIT_EMAIL:-devsync@example.invalid}
      DEVSYNC_AGENT_MODEL: ${DEVSYNC_AGENT_MODEL:-openai:gpt-4.1-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      BEDROCK_AWS_REGION: ${BEDROCK_AWS_REGION:-}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      BEDROCK_AWS_ACCESS_KEY_ID: ${BEDROCK_AWS_ACCESS_KEY_ID:-}
      BEDROCK_AWS_SECRET_ACCESS_KEY: ${BEDROCK_AWS_SECRET_ACCESS_KEY:-}
      BEDROCK_AWS_SESSION_TOKEN: ${BEDROCK_AWS_SESSION_TOKEN:-}
      DEVSYNC_BEDROCK_APPLICATION_INFERENCE_PROFILE: ${DEVSYNC_BEDROCK_APPLICATION_INFERENCE_PROFILE:-}
      DEVSYNC_MAX_UPLOAD_BYTES: 52428800
    volumes:
      - ./data:/data
